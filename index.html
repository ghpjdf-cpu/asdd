<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azim | Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-card, .skills-card, .social-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .avatar-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        h2 {
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 14px;
        }

        .role {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .bio {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .skill-tag {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .links-box {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            display: inline-block;
            text-align: center;
        }

        .telegram {
            background-color: #38bdf8;
            color: #0b0f19;
        }

        .telegram:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }

        .github {
            background-color: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .github:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="profile-card">
            <div class="avatar-box">
                <img src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="Avatar">
            </div>
            <h1>Азим</h1>
            <p class="role">IT Student & Mobilegrapher</p>
            <p class="bio">Создаю сайты и монтирую визуал.</p>
        </header>

        <section class="skills-card">
            <h2>Технологии</h2>
            <div class="skills-grid">
                <span class="skill-tag">HTML & CSS</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Video Editing</span>
            </div>
        </section>

        <footer class="social-card">
            <h2>Связь</h2>
            <div class="links-box">
                <a href="https://t.me/youmfsgo" target="_blank" class="btn telegram">Telegram</a>
                <a href="https://github.com" target="_blank" class="btn github">GitHub</a>
            </div>
        </footer>
    </div>

</body>
</html>
